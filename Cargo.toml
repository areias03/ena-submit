[package]
name = "ena-submit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
flate2 = "1.0"
quick-xml = "0.36"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.19"
time = { version = "0.3", features = ["formatting"] }
toml = "1.1.3"
ureq = { version = "2.12", features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.24"
